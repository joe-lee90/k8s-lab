apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-lab.fullname" . }}-redis
  labels:
    {{- include "k8s-lab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "k8s-lab.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379