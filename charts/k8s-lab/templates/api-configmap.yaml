apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-lab.fullname" . }}-api-config
  labels:
    {{- include "k8s-lab.labels" . | nindent 4 }}
data:
  # The Redis Service name is now release-dependent, so it must be templated.
  # Hardcoding "redis" here would break the moment there are two releases.
  REDIS_HOST: {{ include "k8s-lab.fullname" . }}-redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  APP_NAME: {{ include "k8s-lab.fullname" . | quote }}