apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: lab
spec:
  # ClusterIP: reachable only from inside the cluster, via the DNS name
  # `fastapi` (or fastapi.lab.svc.cluster.local from another namespace).
  #
  # In Stage 7 the NGINX Ingress controller becomes the single external
  # entry point and routes to this Service by name. Keeping this internal
  # means traffic cannot bypass the ingress layer.
  type: ClusterIP
  selector:
    app: fastapi
  ports:
    - name: http
      port: 8000
      targetPort: 8000