apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: lab
type: Opaque
stringData:
  # stringData takes plaintext and Kubernetes base64-encodes it on write.
  # The `data` field would require you to encode it yourself.
  #
  # THIS IS NOT ENCRYPTION. Anyone who can read this manifest, or run
  # `kubectl get secret redis-auth -o yaml`, has the password. It is in your
  # Git repo in plaintext. For a throwaway local password that is an
  # acceptable lab tradeoff; for anything real it is a published credential.
  redis-password: labpassword