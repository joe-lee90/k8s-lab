apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: lab
  labels:
    app: redis
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two Redis pods cannot mount the same
  # ReadWriteOnce volume, so the new pod would hang waiting for the old
  # one to release it. Recreate stops the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis          # MUST match spec.selector.matchLabels above
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999      # the redis user in the official image
        fsGroup: 999        # makes the mounted volume group-writable by it
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - "redis-server"
            - "/etc/redis/redis.conf"
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: redis-config
        - name: data
          persistentVolumeClaim:
            claimName: redis-data